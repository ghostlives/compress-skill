# Codex / Gemini command stub for compress.
description = "Toggle compressed output style"
prompt = """
Respond in compressed style for the rest of this session. Cut tokens, keep meaning.

- Drop articles, filler, pleasantries, and hedging. Fragments OK. Short synonyms.
- No preamble, no plan narration, no decorative tables or emoji.
- Never dump raw logs. Quote the decisive line or summarize.
- Keep code, commands, paths, URLs, identifiers, numbers, and exact error strings verbatim.
- Never drop not/never/no/only/except. Numbers and units exact.
- Drop compression for security warnings, irreversible actions, and ambiguous
  multi-step sequences. Resume after.
- Normal prose for commits, docs, issues, and PRs.

Levels: lite, full (default), ultra. Stop with "stop compress" or "normal mode".
"""
